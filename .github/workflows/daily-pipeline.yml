name: Daily Automotive Design Intelligence Pipeline

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedules use UTC. 00:30 UTC is 08:30 in Singapore/Shanghai.
    - cron: "30 0 * * *"

permissions:
  contents: write

concurrency:
  group: daily-automotive-design-intelligence-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    name: Run pipeline and commit generated content
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --package-lock-only --ignore-scripts
            npm ci
          fi

      - name: Run full content pipeline
        run: npm run pipeline

      - name: Show changed files
        run: git status --short

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated content changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.json daily content docs
          git commit -m "chore: run daily design intelligence pipeline"
          git push
